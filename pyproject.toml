[project]
name = "trove"
version = "0.1.0"
description = "Self-hosted collector: typed, linked, searchable items"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
    "factory-boy",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = ["trove/migrations", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "trove"
version = "0.1.0"
description = "Self-hosted collector: typed, linked, searchable items"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-ox>=1.10",
    "pydantic>=2",
    "pillow>=11",
    "uvicorn>=0.32",
    "django-allauth[mfa]>=65.23.0",
    "django-oauth-toolkit>=3.4.1",
    "pillow-heif>=1",
    "pypdfium2>=5.15.2",
    "av>=19.0.2",
    "playwright>=1.65.2",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-django",
    "factory-boy",
    "zensical>=0.1.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
extend-exclude = ["trove/migrations", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
